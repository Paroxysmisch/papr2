[package]
name = "papr2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-kit = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
# Headless UI tests: simulated clicks with real hit-testing.
gpui-kit = { version = "0.7", features = ["test-support"] }
